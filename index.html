<div class="container">
    <h1>NU CSE CGPA Calculator</h1>

    <div class="semester-wrap">
      <div class="section-label semester-label">Semester</div>
      <div class="semester-picker" id="semesterPicker">
        <button type="button" class="semester-trigger" id="semesterTrigger" aria-haspopup="listbox" aria-expanded="false">

          <span class="semester-arrow">▾</span>
        </button>
        <div class="semester-menu" id="semesterMenu" role="listbox">
          <button type="button" class="semester-option sem-1" data-value="1">Semester I</button>
          <button type="button" class="semester-option sem-2" data-value="2">Semester II</button>

          <button type="button" class="semester-option sem-7" data-value="7">Semester VII</button>
          <button type="button" class="semester-option sem-8" data-value="8">Semester VIII</button>
        </div>
      </div>
      <select id="semester" class="native-semester" aria-hidden="true" tabindex="-1">
          <option value="1">Semester I</option>
          <option value="2">Semester II</option>
          <option value="3">Semester III</option>
          <option value="4">Semester IV</option>
          <option value="5">Semester V</option>
          <option value="6">Semester VI</option>
          <option value="7">Semester VII</option>
          <option value="8">Semester VIII</option>
      </select>
    </div>

    <div class="subject-header"><span>Subject</span><span>Grade</span><span>Marks</span></div>
    <div id="subjects"></div>
    <button id="calculateBtn">Calculate GPA</button>
    <h2 id="result"></h2>
